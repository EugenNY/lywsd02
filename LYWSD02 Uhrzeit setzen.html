<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LYWSD02 Uhrzeit setzen</title>
<style>
:root { --bg:#fff; --fg:#111; --btn:#0a66ff; --btnfg:#fff; --muted:#666;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111; --fg:#eee; --btn:#3b82f6; --muted:#aaa; color-scheme:dark; } }
:root[data-theme="dark"] { --bg:#111; --fg:#eee; --btn:#3b82f6; --muted:#aaa; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,sans-serif;
  min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1.5rem; text-align:center; }
h1 { font-size:1.4rem; margin:0 0 .5rem; }
p { color:var(--muted); max-width:28rem; }
button { font-size:1.2rem; padding:1rem 2rem; border:0; border-radius:1rem; background:var(--btn); color:var(--btnfg); margin:1.5rem 0; }
button:disabled { opacity:.5; }
#out { font-size:1rem; min-height:3rem; white-space:pre-line; }
</style>
</head>
<body>
<h1>Xiaomi-Thermometer: Uhrzeit setzen</h1>
<p>Funktioniert in Chrome (Mac/Android) oder in der Bluefy-App auf dem iPhone. Die Uhrzeit und Zeitzone werden vom Gerät übernommen, auf dem du diese Seite öffnest.</p>
<button id="go">Uhrzeit jetzt setzen</button>
<div id="out"></div>
<script>
const SVC = 'ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6';
const CHR = 'ebe0ccb7-7a0a-4b0c-8a1a-6ff2997da3a6';
const btn = document.getElementById('go'), out = document.getElementById('out');
btn.onclick = async () => {
  btn.disabled = true;
  try {
    if (!navigator.bluetooth) throw new Error('Web Bluetooth wird in diesem Browser nicht unterstützt (iPhone: Bluefy-App verwenden).');
    out.textContent = 'Suche Gerät …';
    const dev = await navigator.bluetooth.requestDevice({ filters:[{ namePrefix:'LYWSD02' }], optionalServices:[SVC] });
    out.textContent = 'Verbinde …';
    const srv = await (await dev.gatt.connect()).getPrimaryService(SVC);
    const chr = await srv.getCharacteristic(CHR);
    const now = new Date();
    const ts = Math.floor(now.getTime()/1000);
    const tz = -now.getTimezoneOffset()/60;
    const buf = new Uint8Array(5);
    new DataView(buf.buffer).setUint32(0, ts, true);
    buf[4] = tz & 0xff;
    await chr.writeValue(buf);
    out.textContent = 'Fertig: ' + now.toLocaleString('de-DE') + ' (UTC' + (tz>=0?'+':'') + tz + ')';
    dev.gatt.disconnect();
  } catch (e) { out.textContent = 'Fehler: ' + e.message; }
  btn.disabled = false;
};
</script>
</body>
</html>
